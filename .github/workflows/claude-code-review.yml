name: Claude Code Review

# Opt-in: runs only on pull requests labelled "claude-review", so a missing
# or expired CLAUDE_CODE_OAUTH_TOKEN doesn't put a red check on every PR.
# Adding the label starts a review; later pushes to the PR re-run it.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    if: >-
      (github.event.action == 'labeled'
      && github.event.label.name == 'claude-review')
      || (github.event.action != 'labeled'
      && contains(github.event.pull_request.labels.*.name, 'claude-review'))
    # Optional: also filter by PR author by adding to the condition above, e.g.
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

