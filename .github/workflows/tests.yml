name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MLX's Linux CPU build runs the full suite without Apple hardware
          - os: ubuntu-latest
            python-version: "3.10"
            mlx: "mlx[cpu]"
          - os: ubuntu-latest
            python-version: "3.12"
            mlx: "mlx[cpu]"
          - os: macos-14
            python-version: "3.12"
            mlx: "mlx"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]" "${{ matrix.mlx }}"

      - name: Run tests
        run: pytest -q
