name: Release

# Builds the package, creates the GitHub release (notes taken from that
# version's CHANGELOG.md section) and publishes to PyPI. Start it either by
# pushing a tag like v1.1.0, or with "Run workflow" on main, which tags the
# current commit as v<version from pyproject.toml>.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the release tag
        id: tag
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run the release from main, not $GITHUB_REF"
              exit 1
            fi
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "::error::Tag $tag does not match pyproject.toml version $version"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # PyPI keeps each release's description for good, so point its images
      # at this release's tag rather than at main, which moves on
      - name: Pin README images to the release tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sed -i "s#raw.githubusercontent.com/$GITHUB_REPOSITORY/main/#raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/#g" README.md
          if grep -q "raw.githubusercontent.com/$GITHUB_REPOSITORY/main/" README.md; then
            echo "::error::README.md still links to main"
            exit 1
          fi

      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract this version's notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            /^## \[/ { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      # Creates the tag at this commit when it doesn't exist yet (manual runs)
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

  pypi:
    needs: github-release
    runs-on: ubuntu-latest
    # PyPI trusted publishing: the project must list this repository,
    # workflow (release.yml) and environment (pypi) as a trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/vayu-whisper/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
